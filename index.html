<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diário de Treino</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Prop-Types e Recharts (Fixado na versão estável 2.12.7) -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-[#F3F4F6] selection:bg-[#72AC44] selection:text-white">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, Component } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip: RechartsTooltip, ResponsiveContainer, BarChart, Bar } = window.Recharts || {};

        // Escudo de Erros para evitar tela branca
        class ErrorBoundary extends Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            render() {
                if (this.state.hasError) return <div className="p-8 text-center text-red-500 font-bold mt-10">Oops! Algo falhou: <br/><span className="text-sm font-normal text-gray-500">{this.state.error.toString()}</span></div>;
                return this.props.children;
            }
        }

        const COLORS = { primary: '#72AC44', secondary: '#05532C', accent: '#662B7F', bg: '#F3F4F6', surface: '#FFFFFF' };

        const PREDEFINED_EXERCISES = [
            "Supino Reto", "Supino Inclinado", "Crucifixo", "Puxada Frontal", "Remada Curvada", 
            "Levantamento Terra", "Agachamento Livre", "Leg Press", "Cadeira Extensora",
            "Desenvolvimento", "Elevação Lateral", "Rosca Direta", "Tríceps Pulley", "Abdominal Supra"
        ];

        const IconHome = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>;
        const IconDumbbell = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6.5 6.5h11"></path><path d="M6.5 17.5h11"></path><rect x="4" y="4" width="2" height="16" rx="1"></rect><rect x="18" y="4" width="2" height="16" rx="1"></rect><path d="M2 8h2"></path><path d="M20 8h2"></path><path d="M2 16h2"></path><path d="M20 16h2"></path></svg>;
        const IconHistory = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
        const IconChart = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>;
        const IconPlus = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const IconCheck = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>;
        const IconX = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
        const IconCalendar = () => <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>;
        const IconTrash = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>;
        const IconEdit = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>;

        // Função segura para tocar um bipe (não depende de internet nem arquivos externos)
        const playBeep = () => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch (e) { console.log("Áudio bloqueado pelo navegador"); }
        };

        const Timer = ({ isActive, initialTime, onClose, timerKey }) => {
            const [timeLeft, setTimeLeft] = useState(initialTime);

            useEffect(() => {
                let interval;
                if (isActive && timeLeft > 0) {
                    interval = setInterval(() => setTimeLeft((t) => t - 1), 1000);
                } else if (timeLeft === 0 && isActive) {
                    clearInterval(interval);
                    playBeep();
                }
                return () => clearInterval(interval);
            }, [isActive, timeLeft]);

            useEffect(() => {
                if (isActive) setTimeLeft(initialTime);
            }, [isActive, initialTime, timerKey]);

            if (!isActive) return null;

            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;

            return (
                <div className="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-white shadow-xl rounded-full px-6 py-3 flex items-center gap-4 z-50 border border-gray-100">
                    <div className="flex flex-col items-center">
                        <span className="text-xs text-gray-500 font-medium">Descanso</span>
                        <span className={`text-2xl font-bold ${timeLeft === 0 ? 'text-[#72AC44]' : 'text-[#05532C]'}`}>
                        {mins}:{secs < 10 ? '0' : ''}{secs}
                        </span>
                    </div>
                    <button onClick={onClose} className="p-2 bg-gray-100 rounded-full text-gray-500 hover:text-gray-800"><IconX /></button>
                </div>
            );
        };

        const AddExerciseModal = ({ isOpen, onClose, onAdd }) => {
            const [searchTerm, setSearchTerm] = useState('');
            if (!isOpen) return null;
            const filteredExercises = PREDEFINED_EXERCISES.filter(ex => ex.toLowerCase().includes(searchTerm.toLowerCase()));
            const handleAdd = (name) => { onAdd(name); setSearchTerm(''); onClose(); };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                    <div className="bg-white rounded-2xl w-full max-w-sm overflow-hidden flex flex-col max-h-[80vh]">
                        <div className="p-4 border-b flex justify-between items-center">
                            <h3 className="font-bold text-lg text-[#05532C]">Adicionar Aparelho</h3>
                            <button onClick={onClose} className="text-gray-500"><IconX /></button>
                        </div>
                        <div className="p-4 border-b">
                            <input type="text" placeholder="Procurar ou escrever novo..." className="w-full bg-gray-100 rounded-lg p-3 outline-none focus:ring-2 focus:ring-[#72AC44]" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                        </div>
                        <div className="overflow-y-auto flex-1 p-2">
                            {filteredExercises.length > 0 ? (
                                filteredExercises.map(ex => (
                                    <button key={ex} onClick={() => handleAdd(ex)} className="w-full text-left p-3 hover:bg-gray-50 rounded-lg border-b border-gray-50">{ex}</button>
                                ))
                            ) : (
                                <button onClick={() => handleAdd(searchTerm)} className="w-full text-left p-3 text-[#72AC44] font-medium hover:bg-gray-50 rounded-lg">+ Criar novo "{searchTerm}"</button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const DailyWorkoutView = ({ workoutDate, existingExercises, onSave, onCancel }) => {
            const [exercises, setExercises] = useState(existingExercises || []);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [timerActive, setTimerActive] = useState(false);
            const [timerKey, setTimerKey] = useState(0);

            const addExercise = (name) => setExercises([...exercises, { id: Date.now(), name, sets: [{ reps: '', weight: '', done: false }] }]);
            const removeExercise = (exerciseId) => setExercises(exercises.filter(ex => ex.id !== exerciseId));
            
            const addSet = (exerciseId) => {
                setExercises(exercises.map(ex => {
                    if (ex.id === exerciseId) {
                        const lastSet = ex.sets[ex.sets.length - 1];
                        return { ...ex, sets: [...ex.sets, { reps: lastSet ? lastSet.reps : '', weight: lastSet ? lastSet.weight : '', done: false }] };
                    }
                    return ex;
                }));
            };

            const updateSet = (exerciseId, setIndex, field, value) => {
                setExercises(exercises.map(ex => {
                    if (ex.id === exerciseId) {
                        const newSets = [...ex.sets];
                        newSets[setIndex] = { ...newSets[setIndex], [field]: value };
                        return { ...ex, sets: newSets };
                    }
                    return ex;
                }));

                if (field === 'done' && value === true) {
                    setTimerActive(true);
                    setTimerKey(prev => prev + 1);
                }
            };

            const saveDailyWorkout = () => {
                if (exercises.length === 0) return onCancel();
                const filteredExercises = exercises.map(ex => ({
                    ...ex, sets: ex.sets.filter(s => s.done || s.weight || s.reps)
                })).filter(ex => ex.sets.length > 0);
                onSave({ date: workoutDate, exercises: filteredExercises });
            };

            const formattedDate = new Date(workoutDate).toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' });

            return (
                <div className="pb-24">
                    <div className="bg-white p-6 shadow-sm rounded-b-3xl mb-6 flex flex-col gap-2">
                        <div className="flex items-center gap-3 text-[#05532C] mb-1">
                            <IconCalendar />
                            <h2 className="text-xl font-bold capitalize">{formattedDate}</h2>
                        </div>
                        <p className="text-gray-500 text-sm">Regista os aparelhos e pesos utilizados.</p>
                    </div>

                    <div className="px-4 space-y-6">
                        {exercises.map((ex, index) => (
                            <div key={ex.id} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-bold text-lg text-gray-800 flex items-center gap-2">
                                        <span className="bg-[#662B7F] text-white rounded-full w-6 h-6 flex items-center justify-center text-xs">{index + 1}</span>
                                        {ex.name}
                                    </h3>
                                    <button onClick={() => removeExercise(ex.id)} className="text-gray-300 hover:text-red-500 p-1"><IconTrash /></button>
                                </div>
                                
                                <div className="grid grid-cols-12 gap-2 text-xs font-semibold text-gray-400 mb-2 px-1">
                                    <div className="col-span-2 text-center">Série</div>
                                    <div className="col-span-4 text-center">Carga (kg)</div>
                                    <div className="col-span-4 text-center">Reps</div>
                                    <div className="col-span-2 text-center">Feito</div>
                                </div>

                                {ex.sets.map((set, sIdx) => (
                                    <div key={sIdx} className={`grid grid-cols-12 gap-2 items-center mb-2 p-1 rounded-lg transition-colors ${set.done ? 'bg-green-50' : ''}`}>
                                        <div className="col-span-2 text-center font-bold text-gray-500">{sIdx + 1}</div>
                                        <div className="col-span-4">
                                            <input type="number" placeholder="0" className="w-full bg-gray-100 text-center rounded-lg p-2 font-semibold text-gray-800 outline-none focus:ring-2 focus:ring-[#72AC44]" value={set.weight} onChange={(e) => updateSet(ex.id, sIdx, 'weight', e.target.value)} disabled={set.done} />
                                        </div>
                                        <div className="col-span-4">
                                            <input type="number" placeholder="0" className="w-full bg-gray-100 text-center rounded-lg p-2 font-semibold text-gray-800 outline-none focus:ring-2 focus:ring-[#72AC44]" value={set.reps} onChange={(e) => updateSet(ex.id, sIdx, 'reps', e.target.value)} disabled={set.done} />
                                        </div>
                                        <div className="col-span-2 flex justify-center">
                                            <button onClick={() => updateSet(ex.id, sIdx, 'done', !set.done)} className={`w-8 h-8 rounded-full flex items-center justify-center transition-all ${set.done ? 'bg-[#72AC44] text-white shadow-md' : 'bg-gray-200 text-gray-400'}`}><IconCheck /></button>
                                        </div>
                                    </div>
                                ))}
                                
                                <button onClick={() => addSet(ex.id)} className="w-full mt-3 py-2 text-sm font-medium text-[#05532C] bg-green-50 rounded-lg hover:bg-green-100">+ Adicionar Série</button>
                            </div>
                        ))}

                        <button onClick={() => setIsModalOpen(true)} className="w-full py-4 border-2 border-dashed border-[#72AC44] text-[#72AC44] rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-green-50"><IconPlus /> Adicionar Aparelho</button>
                    </div>

                    <div className="fixed bottom-20 left-0 w-full px-4 z-40">
                        <div className="max-w-lg mx-auto flex gap-3">
                        <button onClick={onCancel} className="flex-1 py-4 bg-white text-gray-500 rounded-2xl font-bold shadow-lg border border-gray-100">Voltar</button>
                        <button onClick={saveDailyWorkout} className="flex-[2] py-4 bg-[#72AC44] text-white rounded-2xl font-bold shadow-lg">Guardar Dia</button>
                        </div>
                    </div>

                    <AddExerciseModal isOpen={isModalOpen} onClose={() => setIsModalOpen(false)} onAdd={addExercise} />
                    <Timer isActive={timerActive} initialTime={90} onClose={() => setTimerActive(false)} timerKey={timerKey} />
                </div>
            );
        };

        const EvolutionCharts = ({ history, exerciseName }) => {
            if (!LineChart) return <div className="text-center p-6 text-gray-500">Gráficos indisponíveis no momento.</div>;

            const weightDataPoints = history.map(w => {
                const ex = w.exercises.find(e => e.name === exerciseName);
                if (!ex) return null;
                const maxWeight = Math.max(...ex.sets.map(s => Number(s.weight) || 0));
                if (maxWeight === 0) return null;
                return { date: new Date(w.date).toLocaleDateString('pt-PT', {day: '2-digit', month: '2-digit'}), carga: maxWeight };
            }).filter(Boolean).reverse();

            const volumeDataPoints = history.map(w => {
                const totalSets = w.exercises.reduce((acc, ex) => acc + ex.sets.filter(s => s.done).length, 0);
                return { date: new Date(w.date).toLocaleDateString('pt-PT', {day: '2-digit', month: '2-digit'}), series: totalSets }
            }).reverse().slice(-7);

            if (weightDataPoints.length < 1) return <div className="text-center p-6 text-gray-400 bg-gray-50 rounded-xl mt-4">Regista este aparelho nos teus treinos para veres a evolução.</div>;

            return (
                <div className="space-y-6 mt-4">
                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                        <h4 className="font-bold text-[#05532C] mb-1">Evolução de Carga: {exerciseName}</h4>
                        <div className="h-64 w-full">
                            <ResponsiveContainer width="100%" height="100%">
                            <LineChart data={weightDataPoints} margin={{ top: 5, right: 20, bottom: 5, left: -20 }}>
                                <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f0f0f0" />
                                <XAxis dataKey="date" tick={{fontSize: 12, fill: '#9ca3af'}} axisLine={false} tickLine={false} />
                                <YAxis tick={{fontSize: 12, fill: '#9ca3af'}} axisLine={false} tickLine={false} />
                                <RechartsTooltip contentStyle={{ borderRadius: '12px', border: 'none', boxShadow: '0 4px 6px -1px rgb(0 0 0 / 0.1)' }} labelStyle={{ color: '#05532C', fontWeight: 'bold' }} />
                                <Line type="monotone" dataKey="carga" name="Carga Máxima (kg)" stroke="#662B7F" strokeWidth={3} dot={{ r: 4, fill: '#662B7F', strokeWidth: 2, stroke: '#fff' }} activeDot={{ r: 6 }} />
                            </LineChart>
                            </ResponsiveContainer>
                        </div>
                    </div>

                    <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                        <h4 className="font-bold text-[#05532C] mb-1">Volume de Treino (Últimos 7 dias)</h4>
                        <div className="h-48 w-full">
                            <ResponsiveContainer width="100%" height="100%">
                                <BarChart data={volumeDataPoints} margin={{ top: 5, right: 5, bottom: 5, left: -20 }}>
                                    <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f0f0f0" />
                                    <XAxis dataKey="date" tick={{fontSize: 12, fill: '#9ca3af'}} axisLine={false} tickLine={false} />
                                    <YAxis tick={{fontSize: 12, fill: '#9ca3af'}} axisLine={false} tickLine={false} />
                                    <RechartsTooltip cursor={{fill: '#f3f4f6'}} contentStyle={{ borderRadius: '12px', border: 'none' }} />
                                    <Bar dataKey="series" name="Séries Concluídas" fill="#72AC44" radius={[4, 4, 0, 0]} />
                                </BarChart>
                            </ResponsiveContainer>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [history, setHistory] = useState([]);
            const [editingWorkoutDate, setEditingWorkoutDate] = useState(null);
            const [selectedStatEx, setSelectedStatEx] = useState(PREDEFINED_EXERCISES[0]);
            const [confirmDelete, setConfirmDelete] = useState(null); // Modal state for deletions

            useEffect(() => {
                try {
                    const saved = localStorage.getItem('gymAppHistory');
                    if (saved) setHistory(JSON.parse(saved));
                } catch (e) { console.error("Não foi possível acessar o LocalStorage. Você está usando modo privado?"); }
            }, []);

            useEffect(() => {
                try {
                    localStorage.setItem('gymAppHistory', JSON.stringify(history));
                } catch (e) { console.error("Erro ao salvar no LocalStorage"); }
            }, [history]);

            const today = new Date().setHours(0, 0, 0, 0);
            const todayISOString = new Date().toISOString();
            const todayWorkoutIndex = history.findIndex(w => new Date(w.date).setHours(0,0,0,0) === today);
            const todayWorkoutData = todayWorkoutIndex >= 0 ? history[todayWorkoutIndex] : null;

            const handleSaveDaily = (workoutData) => {
                const newHistory = [...history];
                const targetDate = new Date(workoutData.date).setHours(0,0,0,0);
                const index = newHistory.findIndex(w => new Date(w.date).setHours(0,0,0,0) === targetDate);

                if (index >= 0) {
                    if (workoutData.exercises.length === 0) newHistory.splice(index, 1);
                    else newHistory[index] = workoutData;
                } else {
                    if (workoutData.exercises.length > 0) {
                        newHistory.unshift(workoutData);
                        newHistory.sort((a, b) => new Date(b.date) - new Date(a.date));
                    }
                }
                
                setHistory(newHistory);
                setEditingWorkoutDate(null);
                if (activeTab !== 'history') setActiveTab('home');
            };

            const confirmDeletion = () => {
                if (confirmDelete) {
                    setHistory(history.filter(w => w.date !== confirmDelete));
                    setConfirmDelete(null);
                }
            };

            if (editingWorkoutDate) {
                const workoutToEdit = history.find(w => new Date(w.date).setHours(0,0,0,0) === new Date(editingWorkoutDate).setHours(0,0,0,0));
                return (
                <div className="min-h-screen bg-[#F3F4F6] pb-6">
                    <DailyWorkoutView workoutDate={editingWorkoutDate} existingExercises={workoutToEdit ? workoutToEdit.exercises : []} onSave={handleSaveDaily} onCancel={() => setEditingWorkoutDate(null)} />
                </div>
                );
            }

            const totalWorkouts = history.length;
            const totalSets = history.reduce((acc, w) => acc + w.exercises.reduce((acc2, ex) => acc2 + ex.sets.filter(s=>s.done).length, 0), 0);

            return (
                <div className="min-h-screen bg-[#F3F4F6] pb-24 relative max-w-lg mx-auto bg-white shadow-xl overflow-x-hidden">
                    <header className="bg-[#05532C] text-white p-6 pt-10 rounded-b-[2rem] shadow-md">
                        <h1 className="text-3xl font-bold">Olá, Atleta!</h1>
                        <p className="text-green-100 mt-1 opacity-80">Qual aparelho vamos usar hoje?</p>
                    </header>

                    <main className="px-4 -mt-4 bg-[#F3F4F6] h-full rounded-t-3xl pt-8 pb-10 min-h-[calc(100vh-160px)]">
                        {activeTab === 'home' && (
                        <div className="space-y-6">
                            <div className="bg-white rounded-2xl p-5 shadow-sm flex justify-between items-center border border-gray-100">
                            <div className="text-center flex-1 border-r border-gray-100">
                                <p className="text-3xl font-black text-[#662B7F]">{totalWorkouts}</p>
                                <p className="text-[10px] text-gray-500 font-bold uppercase tracking-wide">Treinos</p>
                            </div>
                            <div className="text-center flex-1">
                                <p className="text-3xl font-black text-[#72AC44]">{totalSets}</p>
                                <p className="text-[10px] text-gray-500 font-bold uppercase tracking-wide">Séries Concluídas</p>
                            </div>
                            </div>

                            <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 text-center relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-4 opacity-5"><IconDumbbell /></div>
                            <h2 className="text-lg font-bold text-gray-800 mb-1">Treino de Hoje</h2>
                            <p className="text-sm font-medium text-gray-500 mb-6 capitalize">
                                {new Date().toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' })}
                            </p>
                            
                            {todayWorkoutData && todayWorkoutData.exercises.length > 0 ? (
                                <div className="mb-6 text-left">
                                    <div className="flex items-center gap-2 mb-2"><IconCheck /> <span className="text-sm font-bold text-[#72AC44]">Treino iniciado hoje!</span></div>
                                    <p className="text-xs text-gray-500">{todayWorkoutData.exercises.length} aparelhos registados.</p>
                                </div>
                            ) : null}

                            <button onClick={() => setEditingWorkoutDate(todayWorkoutData ? todayWorkoutData.date : todayISOString)} className="w-full bg-[#72AC44] text-white font-bold text-lg py-4 rounded-2xl shadow-lg shadow-[#72AC44]/40 flex items-center justify-center gap-2 hover:bg-[#629a39] active:scale-95 transition-all">
                                {todayWorkoutData ? 'CONTINUAR REGISTO' : 'INICIAR REGISTO'}
                            </button>
                            </div>

                            {todayWorkoutData && todayWorkoutData.exercises.length > 0 && (
                                <div>
                                    <h3 className="font-bold text-gray-600 mb-3 px-2">Aparelhos de Hoje</h3>
                                    <div className="space-y-2">
                                        {todayWorkoutData.exercises.map(ex => (
                                            <div key={ex.id} className="bg-white p-4 rounded-xl flex justify-between items-center shadow-sm border border-gray-50">
                                                <div><p className="font-bold text-[#05532C]">{ex.name}</p><p className="text-xs text-gray-500">{ex.sets.filter(s=>s.done).length} séries concluídas</p></div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                        )}

                        {activeTab === 'history' && (
                        <div className="space-y-4">
                            <h2 className="text-xl font-bold text-[#05532C] px-2">Diário de Treinos</h2>
                            {history.length === 0 ? (
                            <p className="text-center text-gray-500 py-10">Nenhum treino registado ainda.</p>
                            ) : (
                            history.map((h, i) => (
                                <div key={i} className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                                <div className="flex justify-between items-center mb-3 border-b border-gray-50 pb-3">
                                    <div className="flex flex-col">
                                        <span className="font-bold text-[#662B7F] capitalize">{new Date(h.date).toLocaleDateString('pt-PT', { weekday: 'long' })}</span>
                                        <span className="text-sm font-medium text-gray-500">{new Date(h.date).toLocaleDateString('pt-PT')}</span>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => setEditingWorkoutDate(h.date)} className="p-2 text-gray-400 hover:text-[#72AC44] bg-gray-50 hover:bg-green-50 rounded-full"><IconEdit /></button>
                                        <button onClick={() => setConfirmDelete(h.date)} className="p-2 text-gray-400 hover:text-red-500 bg-gray-50 hover:bg-red-50 rounded-full"><IconTrash /></button>
                                    </div>
                                </div>
                                <div className="text-sm text-gray-600">
                                    <p className="font-medium mb-2 text-[#05532C]">Aparelhos utilizados:</p>
                                    <ul className="list-disc list-inside space-y-1">
                                        {h.exercises.map(e => (
                                            <li key={e.id} className="text-gray-500 text-xs"><span className="font-semibold text-gray-700">{e.name}</span> ({e.sets.filter(s=>s.done).length} séries)</li>
                                        ))}
                                    </ul>
                                </div>
                                </div>
                            ))
                            )}
                        </div>
                        )}

                        {activeTab === 'stats' && (
                        <div className="space-y-4">
                            <h2 className="text-xl font-bold text-[#05532C] px-2 mb-4">A Tua Evolução</h2>
                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                            <label className="text-sm font-bold text-gray-600 mb-2 block">Seleciona o Aparelho</label>
                            <select className="w-full bg-gray-50 p-3 rounded-xl border border-gray-200 outline-none focus:border-[#72AC44]" value={selectedStatEx} onChange={(e) => setSelectedStatEx(e.target.value)}>
                                {PREDEFINED_EXERCISES.map(ex => <option key={ex} value={ex}>{ex}</option>)}
                            </select>
                            </div>
                            <EvolutionCharts history={history} exerciseName={selectedStatEx} />
                        </div>
                        )}
                    </main>

                    {/* Modal Customizado de Confirmação para evitar window.confirm (que não funciona bem no iframe) */}
                    {confirmDelete && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-3xl w-full max-w-sm p-6 text-center shadow-2xl">
                                <h3 className="font-bold text-xl text-[#05532C] mb-2">Eliminar Treino?</h3>
                                <p className="text-gray-500 mb-6 text-sm">Tens a certeza que queres eliminar este treino? Esta ação não pode ser desfeita e perderás os dados destes aparelhos.</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setConfirmDelete(null)} className="flex-1 py-3 bg-gray-100 text-gray-600 rounded-xl font-bold hover:bg-gray-200 transition-colors">Cancelar</button>
                                    <button onClick={confirmDeletion} className="flex-1 py-3 bg-red-500 text-white rounded-xl font-bold hover:bg-red-600 transition-colors shadow-lg shadow-red-500/30">Eliminar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <nav className="fixed bottom-0 w-full bg-white border-t border-gray-100 px-6 py-4 flex justify-between items-center z-40 max-w-lg left-1/2 transform -translate-x-1/2 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
                        <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'home' ? 'text-[#72AC44]' : 'text-gray-400'}`}><IconHome /><span className="text-[10px] font-bold">Diário</span></button>
                        <button onClick={() => setEditingWorkoutDate(todayWorkoutData ? todayWorkoutData.date : todayISOString)} className="bg-[#05532C] text-white p-4 rounded-full -mt-8 shadow-lg shadow-[#05532C]/30 border-4 border-white transform hover:scale-105 transition-transform flex items-center justify-center"><IconPlus /></button>
                        <button onClick={() => setActiveTab('history')} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'history' ? 'text-[#72AC44]' : 'text-gray-400'}`}><IconHistory /><span className="text-[10px] font-bold">Histórico</span></button>
                        <button onClick={() => setActiveTab('stats')} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'stats' ? 'text-[#72AC44]' : 'text-gray-400'}`}><IconChart /><span className="text-[10px] font-bold">Evolução</span></button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
